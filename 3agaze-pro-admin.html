<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1B5E3B"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Agaze Pro · Admin</title>
<style>
:root{--bg:#f3f6f4;--surface:#fff;--ink:#111827;--muted:#6b7280;--leather:#1B5E3B;--good:#15803d;--coral:#c45c4a;--line:#e5ebe7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h1{font-size:22px;color:var(--leather)} h2{font-size:17px;margin-bottom:10px}
.sub{font-size:13px;color:var(--muted);margin:4px 0 12px;line-height:1.4}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--leather)}
button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:650;cursor:pointer;margin-top:10px}
button:disabled{opacity:.6}
.btn-primary{background:var(--leather);color:#fff}.btn-secondary{background:#e8f0eb;color:var(--leather)}.btn-danger{background:#fde8e4;color:var(--coral)}
.btn-sm{width:auto;padding:8px 12px;font-size:13px;margin:6px 6px 0 0;display:inline-block}
.err{color:var(--coral);font-size:13px;margin-top:8px}
.header{background:var(--leather);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}
.header .t{font-size:18px;font-weight:700}.header button{width:auto;margin:0;padding:8px 14px;font-size:13px;background:rgba(255,255,255,.2);color:#fff}
.screen{padding:14px;max-width:720px;margin:0 auto;padding-bottom:40px}
.code{font-size:30px;font-weight:800;letter-spacing:4px;text-align:center;color:var(--leather);background:#e8f5e9;border-radius:12px;padding:14px;margin:10px 0;user-select:all}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b-active{background:#dcfce7;color:#166534}.b-off{background:#fde8e4;color:#9b2c1d}.b-wait{background:#fef3c7;color:#92400e}
.biz{border-top:1px solid var(--line);padding:14px 0}.biz:first-child{border-top:none}
.biz .n{font-size:16px;font-weight:700}.biz .m{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row select{width:auto;padding:8px 10px;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:90%;text-align:center}
.mini{font-size:13px;margin-top:6px}.mini b{letter-spacing:2px}
</style>
</head>
<body>

<div id="s-boot" class="center"><div class="card" style="text-align:center"><h1>Agaze Pro</h1><p class="sub">Admin · Loading…</p></div></div>

<div id="s-login" class="center hidden"><div style="width:100%;max-width:400px"><div class="card">
<h1>Agaze Pro</h1><p style="font-size:16px;font-weight:700;margin-top:2px">Admin</p>
<p class="sub">Only the admin can log in here.</p>
<label>Admin email</label><input id="l-email" type="email" autocomplete="username" autocapitalize="off"/>
<label>Password</label><input id="l-pass" type="password" autocomplete="current-password"/>
<p class="err hidden" id="l-err"></p>
<button type="button" class="btn-primary" id="l-go" onclick="doLogin()">Log in</button>
</div></div></div>

<div id="s-app" class="hidden">
<div class="header"><div class="t">Agaze Pro · Admin</div><button type="button" onclick="doLogout()">Sign out</button></div>
<div class="screen">

<div class="card">
<h2>➕ New customer</h2>
<p class="sub">Type the business name and how long they can use the app. You will get an access code to give them.</p>
<label>Business name *</label><input id="n-name" autocomplete="off"/>
<label>Business type</label>
<select id="n-type"><option value="shoe">👟 Shoe Seller</option><option value="importer">📦 Importer</option></select>
<label>Subscription length</label>
<select id="n-months">
<option value="1">1 month</option><option value="3">3 months</option><option value="6">6 months</option><option value="12" selected>12 months</option>
</select>
<button type="button" class="btn-primary" id="n-go" onclick="createCustomer()">Create & get code</button>
<div id="n-result" class="hidden">
<div class="code" id="n-code"></div>
<button type="button" class="btn-primary" onclick="copyText(document.getElementById('n-code').textContent)">Copy code</button>
<button type="button" class="btn-secondary" onclick="shareCode()">Send by WhatsApp / SMS</button>
</div>
</div>

<div class="card">
<h2>👥 Customers</h2>
<input id="q" type="search" placeholder="Search business name…" oninput="render()" style="margin-bottom:6px"/>
<div id="list"></div>
<p class="sub hidden" id="empty">No customers yet.</p>
</div>

</div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyBXyCaKn8oKaAwcpDZRdXa2DkJTBl4hLeU",
  authDomain:"sales-management-system-44913.firebaseapp.com",
  projectId:"sales-management-system-44913",
  storageBucket:"sales-management-system-44913.firebasestorage.app",
  messagingSenderId:"371864004329",
  appId:"1:371864004329:web:6cb246dfac1f5a55323278"
});
const auth=firebase.auth(), db=firebase.firestore(), FV=firebase.firestore.FieldValue, TS=firebase.firestore.Timestamp;
let ME=null, BIZ=[], INV=[], USERS=[], unsubs=[];

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(id){['s-boot','s-login','s-app'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
let tt=null;function toast(m){const e=$('toast');e.textContent=m;e.classList.remove('hidden');clearTimeout(tt);tt=setTimeout(()=>e.classList.add('hidden'),3500)}
function code7(){const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let o='';const a=new Uint32Array(7);crypto.getRandomValues(a);for(let i=0;i<7;i++)o+=c[a[i]%c.length];return o}
function addMonths(d,n){const x=new Date(d.getTime());x.setMonth(x.getMonth()+n);return x}
function toDate(v){return v?(v.toDate?v.toDate():new Date(v)):null}
function fmt(d){return d?d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—'}
function appLink(){return new URL('./',location.href).href}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){const i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();document.execCommand('copy');i.remove();toast('Copied')}}

/* ---------- login ---------- */
async function doLogin(){
  const e=$('l-email').value.trim(),p=$('l-pass').value;$('l-err').classList.add('hidden');
  if(!e||!p){lerr('Enter email and password');return}
  $('l-go').disabled=true;$('l-go').textContent='Logging in…';
  try{await auth.signInWithEmailAndPassword(e,p)}catch(x){lerr(/credential|password|user-not-found/.test(x.code||'')?'Wrong email or password':(x.message||'Could not log in'))}
  $('l-go').disabled=false;$('l-go').textContent='Log in';
}
function lerr(m){const e=$('l-err');e.textContent=m;e.classList.remove('hidden')}
async function doLogout(){stop();await auth.signOut()}
function stop(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
auth.onAuthStateChanged(async user=>{
  if(!user){ME=null;stop();show('s-login');return}
  let p=null;
  try{const d=await db.collection('users').doc(user.uid).get();p=d.exists?d.data():null}catch(e){}
  if(!p||p.role!=='admin'){await auth.signOut();show('s-login');lerr('This account is not an admin.');return}
  ME={uid:user.uid,name:p.name||'Admin'};
  show('s-app');start();
});
function start(){
  stop();
  unsubs.push(db.collection('businesses').onSnapshot(s=>{BIZ=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(b=>!b.deleted);render()},e=>toast('Cannot read businesses: '+e.message)));
  unsubs.push(db.collection('invites').onSnapshot(s=>{INV=s.docs.map(d=>Object.assign({code:d.id},d.data()));render()},e=>toast('Cannot read codes: '+e.message)));
  unsubs.push(db.collection('users').onSnapshot(s=>{USERS=s.docs.map(d=>Object.assign({uid:d.id},d.data()));render()},function(){}));
}

/* ---------- create customer ---------- */
let lastCode='',lastName='';
async function createCustomer(){
  const name=$('n-name').value.trim();const months=parseInt($('n-months').value,10);
  if(!name){toast('Type the business name');return}
  const b=$('n-go');b.disabled=true;b.textContent='Creating…';
  try{
    const start=new Date(),exp=addMonths(start,months);
    const ref=db.collection('businesses').doc();
    const code=code7();
    const batch=db.batch();
    batch.set(ref,{name:name,type:$('n-type').value,active:true,ownerUid:null,plan:'Standard',subscriptionMonths:months,subscriptionStart:TS.fromDate(start),subscriptionExpiry:TS.fromDate(exp),createdAt:FV.serverTimestamp()});
    batch.set(db.collection('invites').doc(code),{role:'owner',businessId:ref.id,used:false,createdBy:ME.uid,createdAt:FV.serverTimestamp()});
    await batch.commit();
    lastCode=code;lastName=name;
    $('n-code').textContent=code;$('n-result').classList.remove('hidden');
    $('n-name').value='';
    toast('Created — give the code to the owner');
  }catch(e){toast('Could not create: '+(e.message||e))}
  b.disabled=false;b.textContent='Create & get code';
}
function shareText(code,name,role){
  return 'Agaze Pro\n'+(role==='employee'?'Employee':'Owner')+' access code for '+name+': '+code+'\n\n1) Open: '+appLink()+'\n2) Tap "Create account"\n3) Type your name, email, password and this code.';
}
function shareCode(){sendText(shareText(lastCode,lastName,'owner'))}
async function sendText(t){
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  window.location.href='https://wa.me/?text='+encodeURIComponent(t);
}

/* ---------- customers list ---------- */
function status(b,expD){
  if(b.active===false)return ['Suspended','b-off'];
  if(expD&&expD.getTime()<Date.now())return ['Expired','b-off'];
  return ['Active','b-active'];
}
function render(){
  const q=($('q').value||'').trim().toLowerCase();
  const list=BIZ.filter(b=>!q||(b.name||'').toLowerCase().includes(q)).sort((a,b)=>{const x=toDate(b.createdAt),y=toDate(a.createdAt);return (x?x.getTime():0)-(y?y.getTime():0)});
  $('empty').classList.toggle('hidden',list.length>0);
  $('list').innerHTML=list.map(b=>{
    const exp=toDate(b.subscriptionExpiry);const st=status(b,exp);
    const days=exp?Math.ceil((exp.getTime()-Date.now())/86400000):null;
    const owner=USERS.find(u=>u.businessId===b.id&&u.role==='owner'&&!u.deletedAt);
    const ownerInv=INV.find(i=>i.businessId===b.id&&i.role==='owner'&&!i.used);
    const empInv=INV.filter(i=>i.businessId===b.id&&i.role==='employee'&&!i.used);
    const emps=USERS.filter(u=>u.businessId===b.id&&u.role==='employee').length;
    let who=owner?('Owner: <b>'+esc(owner.name)+'</b> · '+esc(owner.email||'')):'<span class="badge b-wait">Owner has not signed up yet</span>';
    let h='<div class="biz"><div class="n">'+esc(b.name)+' <span class="badge '+st[1]+'">'+st[0]+'</span></div>';
    h+='<div class="m">'+who+'<br>Expires: <b>'+fmt(exp)+'</b>'+(days!=null?' · '+(days<0?'ended '+(-days)+' days ago':days+' days left'):'')+(emps?'<br>Employees: '+emps:'')+'</div>';
    if(ownerInv)h+='<div class="mini">Owner code: <b>'+esc(ownerInv.code)+'</b> <button class="btn-secondary btn-sm" onclick="copyText(\''+esc(ownerInv.code)+'\')">Copy</button><button class="btn-secondary btn-sm" onclick="sendText(shareText(\''+esc(ownerInv.code)+'\',\''+esc(b.name).replace(/'/g,'')+'\',\'owner\'))">Send</button></div>';
    empInv.forEach(i=>{h+='<div class="mini">Employee code: <b>'+esc(i.code)+'</b> <button class="btn-secondary btn-sm" onclick="copyText(\''+esc(i.code)+'\')">Copy</button><button class="btn-secondary btn-sm" onclick="sendText(shareText(\''+esc(i.code)+'\',\''+esc(b.name).replace(/'/g,'')+'\',\'employee\'))">Send</button></div>'});
    const tp=(b.type==='importer')?'importer':'shoe';
    h+='<div class="row"><select id="typ-'+b.id+'"><option value="shoe"'+(tp==='shoe'?' selected':'')+'>👟 Shoe Seller</option><option value="importer"'+(tp==='importer'?' selected':'')+'>📦 Importer</option></select><button class="btn-secondary btn-sm" style="margin:0" onclick="setType(\''+b.id+'\')">Save type</button></div>';
    h+='<div class="row"><select id="ext-'+b.id+'"><option value="1">+1 month</option><option value="3">+3 months</option><option value="6">+6 months</option><option value="12" selected>+12 months</option></select><button class="btn-primary btn-sm" style="margin:0" onclick="extend(\''+b.id+'\')">Extend</button></div>';
    h+='<div class="row">';
    h+=b.active===false?'<button class="btn-secondary btn-sm" style="margin:0" onclick="setActive(\''+b.id+'\',true)">Reactivate</button>':'<button class="btn-danger btn-sm" style="margin:0" onclick="setActive(\''+b.id+'\',false)">Suspend</button>';
    h+='<button class="btn-secondary btn-sm" style="margin:0" onclick="newEmployeeCode(\''+b.id+'\')">+ Employee code</button></div></div>';
    return h;
  }).join('');
}
async function extend(id){
  const months=parseInt($('ext-'+id).value,10);
  try{
    const d=await db.collection('businesses').doc(id).get();if(!d.exists){toast('Not found');return}
    const b=d.data();const now=new Date();let base=now;const cur=toDate(b.subscriptionExpiry);
    if(cur&&cur.getTime()>now.getTime())base=cur;
    const ne=addMonths(base,months);
    await db.collection('businesses').doc(id).update({active:true,plan:b.plan||'Standard',subscriptionMonths:months,subscriptionStart:b.subscriptionStart||TS.fromDate(now),subscriptionExpiry:TS.fromDate(ne)});
    try{await db.collection('businesses').doc(id).collection('notifications').add({type:'subscription_renewed',title:'Subscription renewed',message:'Your subscription was extended by '+months+' month(s). New expiry: '+ne.toLocaleDateString()+'.',read:false,createdAt:FV.serverTimestamp()})}catch(e){}
    toast('Extended to '+fmt(ne));
  }catch(e){toast('Could not extend: '+(e.message||e))}
}
async function setType(id){
  const t=$('typ-'+id).value;
  try{
    await db.collection('businesses').doc(id).update({type:t});
    const owner=USERS.find(u=>u.businessId===id&&u.role==='owner');
    if(owner){try{await db.collection('users').doc(owner.uid).update({businessType:t})}catch(e){}}
    toast('Business type saved: '+(t==='importer'?'Importer':'Shoe Seller'));
  }catch(e){toast('Could not save: '+(e.message||e))}
}
async function setActive(id,on){
  if(!on&&!confirm('Suspend this business? Nobody from it can log in until you reactivate.'))return;
  try{await db.collection('businesses').doc(id).update({active:on});toast(on?'Reactivated':'Suspended')}catch(e){toast('Could not update: '+(e.message||e))}
}
async function newEmployeeCode(id){
  try{const c=code7();await db.collection('invites').doc(c).set({role:'employee',businessId:id,used:false,createdBy:ME.uid,createdAt:FV.serverTimestamp()});toast('New employee code: '+c)}catch(e){toast('Could not create: '+(e.message||e))}
}
</script>
</body>
</html>
